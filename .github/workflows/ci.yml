name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine development build identifier
        if: github.event_name == 'push'
        id: release
        run: node scripts/rc-version.mjs

      - name: Test release version logic
        run: npx vitest run scripts/rc-version.test.mjs

      - name: Verify isolated weather bindings
        run: npm run weather:bindings

      - name: Test weather deployment configuration and artifact verification
        run: npx vitest run scripts/verify-weather-bindings.test.mjs scripts/weather-coordinator-artifact.test.mjs

      - name: Test coordinator in Workers runtime
        run: npm run test:workers

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check architecture boundaries
        run: npm run lint:boundaries

      - name: Test coverage
        run: npm run test:coverage

      - name: Build immutable artifact
        env:
          VITE_APP_VERSION: ${{ steps.release.outputs.version || format('pr-{0}', github.event.pull_request.number) }}
          VITE_APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build

      - name: Verify static asset routing
        run: npm run verify:static-routing

      - name: Build coordinator release bundle
        env:
          APP_VERSION: ${{ steps.release.outputs.version || format('pr-{0}', github.event.pull_request.number) }}
          APP_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run weather:build

      - name: Verify bundled coordinator release identity
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version || format('pr-{0}', github.event.pull_request.number) }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run weather:artifact

      - name: Security checks
        env:
          CI: true
        run: npm run security

      - name: Upload validated release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-assets-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            dist/**
            release-artifact/**
          retention-days: 14

  deploy_development:
    name: Deploy development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://navlog.benvon.dev
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.build_version }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          cache: npm

      - name: Verify deployment prerequisites
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Development Cloudflare token is missing.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Development Cloudflare account ID is missing.' >&2; exit 1; }
          test -n "$RELEASE_VERSION" || { echo 'Release version is missing.' >&2; exit 1; }

      - name: Install deployment tooling
        run: npm ci

      - name: Select validated artifact from this CI run
        id: artifact
        run: node scripts/validated-artifact.mjs

      - name: Download validated artifact from this CI run
        env:
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT_NAME" --dir .

      - name: Verify artifact identity
        run: node scripts/verify-deployment-artifact.mjs

      - name: Verify coordinator artifact identity and bytes
        run: npm run weather:artifact

      - name: Deploy verified development coordinator
        run: npx wrangler deploy release-artifact/weather-coordinator/worker.js --no-bundle --config wrangler.weather-coordinator.jsonc --env development

      - name: Deploy to development
        run: npx wrangler deploy --env development --var "APP_ENV:development" --var "APP_VERSION:$RELEASE_VERSION" --var "APP_COMMIT_SHA:$GITHUB_SHA"

      - name: Smoke deployed application
        run: node scripts/smoke-development.mjs

      - name: Tag verified development build
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            test "$(git rev-list -n 1 "$RELEASE_VERSION")" = "$GITHUB_SHA" || { echo 'Development tag points to another commit.' >&2; exit 1; }
          else
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com tag -a "$RELEASE_VERSION" -m "Development build $RELEASE_VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_VERSION"
          fi

      - name: Publish development build prerelease
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Development build already published for this run.'
          else
            gh release create "$RELEASE_VERSION" --verify-tag --prerelease --latest=false --title "$RELEASE_VERSION" --notes "Development build for $GITHUB_SHA, deployed and smoke-tested at https://navlog.benvon.dev."
          fi
