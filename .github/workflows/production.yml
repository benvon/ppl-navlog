name: Production promotion

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-rc.*'

permissions:
  contents: read

concurrency:
  group: production-promotion

jobs:
  promote:
    name: Promote tagged release to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://navlog.benvon.net
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      STABLE_TAG: ${{ github.ref_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout manually tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify stable tag, release candidate, and CI run
        id: candidate
        run: node scripts/verify-production-candidate.mjs

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install deployment tooling
        run: npm ci

      - name: Check production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Production Cloudflare token is missing.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Production Cloudflare account ID is missing.' >&2; exit 1; }

      - name: Download artifact from the verified CI run attempt
        env:
          ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          CI_RUN_ID: ${{ steps.candidate.outputs.ci_run_id }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.dev_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          gh run download "$CI_RUN_ID" --name "$ARTIFACT_NAME" --dir .
          GITHUB_SHA="$CANDIDATE_SHA" node scripts/verify-deployment-artifact.mjs
          RELEASE_VERSION="$RELEASE_VERSION" CANDIDATE_SHA="$CANDIDATE_SHA" npm run weather:artifact

      - name: Deploy verified production coordinator
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit_sha }}
        run: npx wrangler deploy release-artifact/weather-coordinator/worker.js --no-bundle --config wrangler.weather-coordinator.jsonc --env production

      - name: Deploy to production
        env:
          RELEASE_VERSION: ${{ steps.candidate.outputs.stable_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit_sha }}
        run: npx wrangler deploy --env production --var "APP_ENV:production" --var "APP_VERSION:$RELEASE_VERSION" --var "APP_COMMIT_SHA:$CANDIDATE_SHA"

      - name: Smoke deployed application
        env:
          BUILD_VERSION: ${{ steps.candidate.outputs.dev_tag }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.stable_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit_sha }}
        run: GITHUB_SHA="$CANDIDATE_SHA" node scripts/smoke-production.mjs

      - name: Publish GitHub release
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit_sha }}
        run: |
          if gh release view "$STABLE_TAG" >/dev/null 2>&1; then
            echo 'Stable release already published.'
          else
            gh release create "$STABLE_TAG" --verify-tag --latest --title "$STABLE_TAG" --notes "Production release for $CANDIDATE_SHA, deployed and smoke-tested at https://navlog.benvon.net and https://navlog.pplstudyguide.com."
          fi
